apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs454-midterm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cs454-midterm
  template:
    metadata:
      labels:
        app: cs454-midterm
    spec:
      containers:
        - name: app
          image: cs454-midterm:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: SERVICE_NAME
              value: "cs454-midterm"
            - name: MESSAGE
              value: "Hello from Kubernetes"
          ports:
            - containerPort: 8080